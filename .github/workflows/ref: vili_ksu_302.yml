name: Build vili_ksu_302

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: vili_ksu_302
          fetch-depth: 1
          submodules: false

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make libc6-dev libncurses5-dev \
            cpio lz4 zip curl python3 python-is-python3 pahole dwarves rsync kmod

      - name: Download clang
        run: |
          mkdir -p clang
          curl -L -o clang.tar.gz \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r416183b.tar.gz
          tar -xf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: Build vili
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 vendor/lahaina-qgki_defconfig vendor/vili_QGKI.config
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: Pack
        run: |
          mkdir -p artifact
          cp out/arch/arm64/boot/Image artifact/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz artifact/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb artifact/ 2>/dev/null || true
          find out -name "*.ko" -exec cp {} artifact/ \; || true
          zip -r vili_ksu_302.zip artifact

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vili_ksu_302
          path: vili_ksu_302.zip
